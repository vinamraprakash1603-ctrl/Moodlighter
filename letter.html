<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Letter 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root { --pink:#ff6eb4; --pink-s:#ffb3d9; --pink-g:rgba(255,110,180,.25); --purple:#8b3dc8; --bg:#04000e; --white:#f0d8ff; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body {
  width:100%; min-height:100%; background:var(--bg);
  font-family:'DM Sans',sans-serif; color:var(--white);
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}

#starfield { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
#starfield::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(140,60,200,.15) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(255,80,160,.09) 0%,transparent 45%);
}
.star { position:absolute; border-radius:50%; background:#fff; animation:tw var(--d,2s) ease-in-out infinite alternate; animation-delay:var(--dl,0s); }
@keyframes tw { from{opacity:.07;transform:scale(.6)} to{opacity:.75;transform:scale(1.3)} }

#scan { position:fixed; inset:0; pointer-events:none; z-index:1; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px); opacity:.4; }

/* ── PAGE ── */
#app { position:relative; z-index:2; min-height:100vh; padding-bottom:calc(env(safe-area-inset-bottom,16px) + 40px); animation:fadeIn .5s ease both; }
@keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

/* ── STATUS + NAV BAR ── */
.topbar {
  padding: calc(env(safe-area-inset-top,20px) + 12px) 18px 10px;
  display:flex; align-items:center; gap:10px;
}
.back-btn {
  display:flex; align-items:center; gap:4px;
  background:none; border:none; color:rgba(255,179,217,.5);
  font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer;
  padding:6px 0; flex-shrink:0;
}
.back-btn:active { color:var(--pink-s); }
.back-arrow { font-size:20px; line-height:1; }
.topbar-title {
  flex:1; text-align:center;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:15px; font-weight:300; color:rgba(240,216,255,.5);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-spacer { width:52px; flex-shrink:0; }

/* ── DAY PILL ── */
.day-pill-wrap { text-align:center; padding:0 0 14px; }
.day-pill {
  display:inline-block;
  font-size:7px; letter-spacing:3px;
  background:rgba(255,110,180,.12);
  color:var(--pink); border:1px solid rgba(255,110,180,.3);
  padding:4px 14px; border-radius:99px;
}

/* ── IMAGE GALLERY ── */
.gallery-wrap { position:relative; padding:0 16px; margin-bottom:6px; }
.gallery-track {
  display:flex; gap:10px;
  overflow-x:auto; overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none; padding-bottom:2px;
}
.gallery-track::-webkit-scrollbar { display:none; }
.gallery-img {
  flex:0 0 calc(100% - 32px); scroll-snap-align:start;
  border-radius:16px; overflow:hidden;
  background:linear-gradient(135deg,rgba(255,110,180,.14),rgba(140,60,200,.1));
  border:1px solid rgba(255,110,180,.2);
  position:relative;
  min-height:260px;
  display:flex; align-items:center; justify-content:center;
}
.gallery-img img {
  width:100%; height:100%;
  object-fit:contain; display:block;
  border-radius:16px;
}
.gallery-img .img-placeholder {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  color:rgba(255,179,217,.35); font-size:12px; letter-spacing:1px;
  padding:40px;
}
.img-counter {
  position:absolute; top:12px; right:12px;
  background:rgba(4,0,14,.65); border-radius:99px;
  padding:3px 10px; font-size:9px; color:rgba(255,179,217,.65);
  backdrop-filter:blur(8px);
}

/* dot indicators */
.gallery-dots { display:flex; gap:5px; justify-content:center; margin:10px 0 18px; }
.gdot {
  height:3px; border-radius:99px;
  background:rgba(255,110,180,.25);
  transition:width .3s ease, background .3s ease;
  width:5px;
}
.gdot.active { width:18px; background:var(--pink); }

/* ── SECTION HEADER ── */
.sec-head {
  font-size:7px; letter-spacing:3px; color:rgba(255,179,217,.25);
  padding:4px 18px 10px;
}

/* ── VOICE PLAYERS ── */
.voices-wrap { padding:0 16px; display:flex; flex-direction:column; gap:9px; }

.vplayer {
  background:rgba(140,60,200,.08);
  border:1px solid rgba(140,60,200,.2);
  border-radius:14px; padding:12px 14px;
  display:flex; align-items:center; gap:12px;
}

.play-btn {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:rgba(255,110,180,.15);
  border:1.5px solid rgba(255,110,180,.35);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .2s, transform .15s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.play-btn:active { transform:scale(.93); background:rgba(255,110,180,.28); }
.play-btn.playing { background:rgba(255,110,180,.28); border-color:var(--pink); }

.play-icon { width:0; height:0; border-style:solid; border-width:6px 0 6px 11px; border-color:transparent transparent transparent var(--pink); margin-left:2px; transition:opacity .15s; }
.pause-icon { display:none; gap:3px; }
.pause-icon span { width:3px; height:12px; background:var(--pink); border-radius:1px; display:block; }
.play-btn.playing .play-icon  { display:none; }
.play-btn.playing .pause-icon { display:flex; }

/* waveform */
.waveform { flex:1; display:flex; align-items:center; gap:2px; height:28px; overflow:hidden; cursor:pointer; }
.wbar { width:3px; border-radius:2px; background:rgba(190,140,255,.3); transition:background .2s; flex-shrink:0; }
.wbar.played { background:rgba(255,110,180,.7); }
.wbar.active { background:var(--pink); animation:barBounce .4s ease-in-out infinite alternate; }
@keyframes barBounce { from{transform:scaleY(.5)} to{transform:scaleY(1.2)} }

.vtime {
  font-size:9px; color:rgba(190,140,255,.45);
  white-space:nowrap; min-width:30px; text-align:right;
  font-variant-numeric:tabular-nums;
}
.vname {
  font-size:8px; color:rgba(255,179,217,.35);
  letter-spacing:1px; margin-bottom:3px;
}

/* ── BOTTOM QUOTE ── */
.bottom-quote {
  text-align:center;
  font-family:'Cormorant Garamond',serif; font-style:italic;
  font-size:13px; color:rgba(255,179,217,.18);
  padding:28px 30px 0; line-height:1.8;
}
</style>
</head>
<body>

<div id="starfield"></div>
<div id="scan"></div>

<div id="app">
  <div class="topbar">
    <button class="back-btn" onclick="history.back()">
      <span class="back-arrow">‹</span>
      <span>back</span>
    </button>
    <div class="topbar-title" id="page-title">for you, today 💌</div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="day-pill-wrap">
    <div class="day-pill" id="day-pill">DAY —</div>
  </div>

  <!-- image gallery -->
  <div class="gallery-wrap" id="gallery-wrap" style="display:none">
    <div class="gallery-track" id="gallery-track"></div>
    <div class="gallery-dots" id="gallery-dots"></div>
  </div>

  <!-- voice section -->
  <div id="voice-section" style="display:none">
    <div class="sec-head">VOICE NOTES</div>
    <div class="voices-wrap" id="voices-wrap"></div>
  </div>

  <div class="bottom-quote">— with love, always 💗</div>
</div>

<script src="config.js"></script>
<script>
// ── STARS ──────────────────────────────────────────────────────
(function() {
  const f = document.getElementById('starfield');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random()*2+.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;--dl:${Math.random()*5}s`;
    f.appendChild(s);
  }
})();

// ── GET DAY FROM URL ───────────────────────────────────────────
const params = new URLSearchParams(location.search);
const dayNum = parseInt(params.get('day'));
const dayData = CONFIG.days.find(d => d.day === dayNum);

if (!dayData) { history.back(); }

// ── HEADER ─────────────────────────────────────────────────────
document.getElementById('day-pill').textContent = `DAY ${String(dayNum).padStart(2,'0')}`;
const unlock = new Date(dayData.unlocksAt);
const opts = { day:'numeric', month:'long' };
document.getElementById('page-title').textContent = `${unlock.toLocaleDateString('en-IN', opts)} 💌`;

// ── GALLERY ────────────────────────────────────────────────────
const folder = `assets/day${String(dayNum).padStart(2,'0')}/`;
const images = dayData.images || [];

if (images.length > 0) {
  document.getElementById('gallery-wrap').style.display = 'block';
  const track = document.getElementById('gallery-track');
  const dotsEl = document.getElementById('gallery-dots');

  // build images
  images.forEach((img, i) => {
    const div = document.createElement('div'); div.className = 'gallery-img';
    const imgEl = document.createElement('img');
    imgEl.src = folder + img;
    imgEl.alt = `Letter photo ${i+1}`;
    imgEl.onerror = function() {
      div.innerHTML = `<div class="img-placeholder"><div style="font-size:24px;margin-bottom:4px;">🌸</div><div>letter ${i+1}</div></div>`;
    };
    div.appendChild(imgEl);

    if (images.length > 1) {
      const counter = document.createElement('div');
      counter.className = 'img-counter';
      counter.textContent = `${i+1} / ${images.length}`;
      div.appendChild(counter);
    }

    track.appendChild(div);
  });

  // dots
  if (images.length > 1) {
    images.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'gdot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(dot);
    });

    // scroll sync
    track.addEventListener('scroll', () => {
      const idx = Math.round(track.scrollLeft / track.offsetWidth);
      dotsEl.querySelectorAll('.gdot').forEach((d,i) => {
        d.classList.toggle('active', i === idx);
      });
      // update counters
      track.querySelectorAll('.img-counter').forEach((c,i) => {
        c.textContent = `${i+1} / ${images.length}`;
      });
    }, { passive:true });
  } else {
    dotsEl.style.display = 'none';
  }
}

// ── VOICE PLAYERS ──────────────────────────────────────────────
const voices = dayData.voices || [];

if (voices.length > 0) {
  document.getElementById('voice-section').style.display = 'block';
  const wrap = document.getElementById('voices-wrap');

  voices.forEach((vf, idx) => {
    const audio = new Audio(folder + vf);
    audio.preload = 'metadata';

    // build waveform bars (random heights, look natural)
    const BARS = 36;
    const heights = Array.from({length:BARS}, () => Math.floor(5 + Math.random() * 22));

    let barsHtml = heights.map(h => `<div class="wbar" style="height:${h}px"></div>`).join('');

    const el = document.createElement('div'); el.className = 'vplayer';
    el.innerHTML = `
      <div class="play-btn" id="pb-${idx}">
        <div class="play-icon"></div>
        <div class="pause-icon"><span></span><span></span></div>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="vname">voice note ${idx+1}</div>
        <div class="waveform" id="wf-${idx}">${barsHtml}</div>
      </div>
      <div class="vtime" id="vt-${idx}">0:00</div>`;
    wrap.appendChild(el);

    const btn = document.getElementById(`pb-${idx}`);
    const wf  = document.getElementById(`wf-${idx}`);
    const vtEl = document.getElementById(`vt-${idx}`);
    const bars = wf.querySelectorAll('.wbar');

    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2,'0')}`;
    }

    // update progress on timeupdate
    audio.addEventListener('timeupdate', () => {
      const pct = audio.duration ? audio.currentTime / audio.duration : 0;
      const played = Math.floor(pct * BARS);
      bars.forEach((b, i) => {
        b.classList.remove('played', 'active');
        if (i < played) b.classList.add('played');
        else if (i === played) b.classList.add('active');
      });
      vtEl.textContent = fmtTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      vtEl.textContent = fmtTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      btn.classList.remove('playing');
      bars.forEach(b => b.classList.remove('played','active'));
      vtEl.textContent = fmtTime(audio.duration || 0);
    });

    // play/pause
    btn.addEventListener('click', () => {
      // pause all others
      document.querySelectorAll('.play-btn.playing').forEach(b => {
        if (b !== btn) {
          b.classList.remove('playing');
          const id = b.id.replace('pb-','');
          // find and pause the right audio — store on element
          b._audio && b._audio.pause();
        }
      });

      if (audio.paused) {
        audio.play().then(() => btn.classList.add('playing')).catch(()=>{});
      } else {
        audio.pause();
        btn.classList.remove('playing');
      }
    });
    btn._audio = audio;

    // tap waveform to seek
    wf.addEventListener('click', e => {
      if (!audio.duration) return;
      const rect = wf.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
  });
}
</script>
</body>
</html>
