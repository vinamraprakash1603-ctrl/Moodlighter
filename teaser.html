<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Not yet... 🔒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root { --pink:#ff6eb4; --pink-s:#ffb3d9; --purple:#8b3dc8; --bg:#04000e; --white:#f0d8ff; }
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body {
  width:100%; height:100%; background:var(--bg);
  font-family:'DM Sans',sans-serif; color:var(--white);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

#starfield { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
#starfield::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(140,60,200,.2) 0%,transparent 50%),
    radial-gradient(ellipse at 70% 70%, rgba(255,80,160,.12) 0%,transparent 45%);
}
.star {
  position:absolute; border-radius:50%; background:#fff;
  animation:tw var(--d,2s) ease-in-out infinite alternate;
  animation-delay:var(--dl,0s);
}
@keyframes tw { from{opacity:.08;transform:scale(.6)} to{opacity:.8;transform:scale(1.3)} }

#scan {
  position:fixed; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);
  opacity:.4;
}

/* ── BACK BTN ── */
.back-btn {
  position:fixed;
  top:calc(env(safe-area-inset-top,20px) + 14px);
  left:18px; z-index:10;
  display:flex; align-items:center; gap:6px;
  cursor:pointer; opacity:.6;
  transition:opacity .2s;
  background:none; border:none; color:var(--pink-s);
  font-family:'DM Sans',sans-serif; font-size:13px;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:active { opacity:1; }
.back-arrow { font-size:20px; line-height:1; margin-top:-1px; }

/* ── CENTERED CONTENT ── */
#page {
  position:relative; z-index:2;
  height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:0 32px;
  text-align:center;
  animation:fadeUp .6s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(30px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── BIG LOCK ── */
.lock-wrap {
  width:64px; height:76px; position:relative; margin:0 auto 28px;
  animation:lockFloat 4s ease-in-out infinite alternate;
}
@keyframes lockFloat { from{transform:translateY(0)} to{transform:translateY(-10px)} }

.lock-body {
  width:64px; height:42px;
  background:rgba(255,110,180,.08);
  border:2px solid rgba(255,110,180,.3);
  border-radius:10px;
  position:absolute; bottom:0;
  display:flex; align-items:center; justify-content:center;
}
.lock-keyhole {
  width:13px; height:20px; position:relative;
}
.lock-keyhole::before {
  content:''; width:13px; height:13px;
  border:2px solid rgba(255,110,180,.45);
  border-radius:50%;
  position:absolute; top:0;
  display:block;
}
.lock-keyhole::after {
  content:''; width:5px; height:10px;
  background:rgba(255,110,180,.35);
  border-radius:0 0 3px 3px;
  position:absolute; bottom:0; left:4px;
  display:block;
}
.lock-shackle {
  width:38px; height:38px;
  border:2.5px solid rgba(255,110,180,.32);
  border-bottom:none;
  border-radius:19px 19px 0 0;
  position:absolute; top:0; left:13px;
}

/* glow ring */
.lock-glow {
  position:absolute; inset:-10px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,110,180,.1), transparent 70%);
  animation:glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.15)} }

/* ── DAY LABEL ── */
.teaser-day {
  font-size:8px; letter-spacing:4px;
  color:rgba(255,179,217,.4); margin-bottom:18px;
}

/* ── MESSAGE ── */
.teaser-msg {
  font-family:'Cormorant Garamond', serif;
  font-style:italic; font-size:20px; font-weight:300;
  color:rgba(240,216,255,.78);
  line-height:1.75;
  margin-bottom:28px;
  max-width:300px;
}

/* ── DIVIDER ── */
.teaser-div {
  width:40px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,110,180,.4),transparent);
  margin:0 auto 22px;
}

/* ── COUNTDOWN ── */
.countdown {
  font-size:11px; color:rgba(255,110,180,.45);
  letter-spacing:2px; margin-bottom:10px;
}
.countdown-time {
  font-family:'Cormorant Garamond', serif;
  font-size:28px; font-weight:300;
  color:rgba(255,110,180,.65);
  letter-spacing:4px;
}

/* ── HEARTS ── */
.hearts {
  position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.fheart {
  position:absolute; font-size:10px; color:rgba(255,110,180,.12);
  animation:floatUp var(--dur,8s) linear infinite;
  animation-delay:var(--dl,0s);
}
@keyframes floatUp {
  0%   { transform:translateY(100vh) scale(1); opacity:.15; }
  100% { transform:translateY(-20vh) scale(.5); opacity:0; }
}
</style>
</head>
<body>

<div id="starfield"></div>
<div id="scan"></div>
<div class="hearts" id="hearts"></div>

<button class="back-btn" onclick="history.back()">
  <span class="back-arrow">‹</span>
  <span>back</span>
</button>

<div id="page">
  <div class="lock-wrap">
    <div class="lock-glow"></div>
    <div class="lock-shackle"></div>
    <div class="lock-body">
      <div class="lock-keyhole"></div>
    </div>
  </div>

  <div class="teaser-day" id="teaser-day">DAY — · —</div>
  <div class="teaser-msg" id="teaser-msg">loading...</div>
  <div class="teaser-div"></div>
  <div class="countdown">opens in</div>
  <div class="countdown-time" id="countdown">—</div>
</div>

<script>
// ── STARS ──────────────────────────────────────────────────────
(function() {
  const f = document.getElementById('starfield');
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const sz = Math.random()*2+.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1.4+Math.random()*3}s;--dl:${Math.random()*5}s`;
    f.appendChild(s);
  }
})();

// ── FLOATING HEARTS ────────────────────────────────────────────
(function() {
  const h = document.getElementById('hearts');
  const emojis = ['♡','♡','✦','·'];
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div'); el.className = 'fheart';
    el.textContent = emojis[i % emojis.length];
    el.style.cssText = `left:${Math.random()*100}%;--dur:${7+Math.random()*8}s;--dl:${Math.random()*10}s`;
    h.appendChild(el);
  }
})();

// ── LOAD TEASER DATA ───────────────────────────────────────────
const data = JSON.parse(sessionStorage.getItem('teaser') || '{}');
if (!data.day) { history.back(); }

document.getElementById('teaser-day').textContent = `DAY ${String(data.day).padStart(2,'0')}`;
document.getElementById('teaser-msg').textContent = data.msg || '...';

// ── COUNTDOWN ──────────────────────────────────────────────────
function updateCountdown() {
  const unlock = new Date(data.unlocksAt);
  const now = new Date();
  const diff = unlock - now;

  if (diff <= 0) {
    document.getElementById('countdown').textContent = 'now ✨';
    return;
  }

  const days  = Math.floor(diff / 86400000);
  const hrs   = Math.floor((diff % 86400000) / 3600000);
  const mins  = Math.floor((diff % 3600000) / 60000);
  const secs  = Math.floor((diff % 60000) / 1000);

  let parts = [];
  if (days > 0) parts.push(`${days}d`);
  if (hrs  > 0 || days > 0) parts.push(`${hrs}h`);
  parts.push(`${String(mins).padStart(2,'0')}m`);
  parts.push(`${String(secs).padStart(2,'0')}s`);

  document.getElementById('countdown').textContent = parts.join(' ');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
