<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Letters 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=DM+Mono:wght@300;400&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ff6eb4;
  --pink2: #ff3d9a;
  --soft: #ffb3d9;
  --purple: #7c3aed;
  --rose: #fb7185;
  --bg: #030008;
  --card-bg: rgba(255,255,255,0.032);
  --white: #fdf0ff;
  --muted: rgba(255,179,217,0.45);
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  width:100%; min-height:100%;
  background:var(--bg);
  font-family:'DM Mono', monospace;
  color:var(--white);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── CANVAS BG ── */
#bgCanvas {
  position:fixed; inset:0; z-index:0;
  pointer-events:none;
}

/* ── NOISE OVERLAY ── */
#app {
  position:relative; z-index:2;
  min-height:100vh;
  padding-bottom:calc(env(safe-area-inset-bottom,16px) + 60px);
}

/* ── HEADER ── */
.header {
  padding: calc(env(safe-area-inset-top,44px) + 16px) 24px 0;
  text-align:center;
  position:relative;
}

.header-tag {
  display:inline-flex; align-items:center; gap:8px;
  font-size:9px; letter-spacing:4px; color:rgba(255,110,180,0.5);
  margin-bottom:20px; font-weight:400;
}
.header-tag::before, .header-tag::after {
  content:''; width:20px; height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,110,180,0.4));
}
.header-tag::after { transform:scaleX(-1); }

.header-name {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(36px, 11vw, 52px);
  font-weight:300; font-style:italic;
  line-height:1.05;
  color:var(--white);
  letter-spacing:-1px;
  margin-bottom:4px;
}
.header-name em {
  font-style:italic;
  background:linear-gradient(135deg, #ff6eb4, #fb7185, #c084fc);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header-sub {
  font-family:'Gochi Hand', cursive;
  font-size:15px; color:rgba(255,179,217,0.5);
  letter-spacing:1px; margin-bottom:28px;
}

/* ── PROGRESS RING ── */
.progress-wrap {
  display:flex; align-items:center; justify-content:center;
  gap:16px; margin-bottom:36px;
}
.ring-wrap { position:relative; width:52px; height:52px; }
.ring-svg { transform:rotate(-90deg); }
.ring-track { fill:none; stroke:rgba(255,110,180,.1); stroke-width:3; }
.ring-fill {
  fill:none; stroke:url(#ringGrad); stroke-width:3;
  stroke-linecap:round;
  transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1);
}
.ring-center {
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.ring-num {
  font-family:'Cormorant Garamond', serif;
  font-size:16px; font-weight:400;
  color:var(--pink); line-height:1;
}
.ring-label { font-size:6px; color:var(--muted); letter-spacing:2px; margin-top:1px; }
.progress-text {
  font-family:'Cormorant Garamond', serif;
  font-style:italic; font-size:17px;
  color:rgba(255,179,217,.55); line-height:1.5;
}
.progress-text strong { color:rgba(255,179,217,.85); font-weight:400; }

/* ── SECTION LABEL ── */
.section-label {
  display:flex; align-items:center; gap:10px;
  padding:0 20px 12px;
  font-size:8px; letter-spacing:4px;
  color:rgba(255,179,217,.28);
}
.section-label::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, rgba(255,110,180,.15), transparent);
}

/* ── CARDS ── */
.cards { padding:0 16px; display:flex; flex-direction:column; gap:12px; }

/* ── OPEN CARD ── */
.card-open {
  border-radius:20px;
  background:var(--card-bg);
  border:1px solid rgba(255,110,180,.2);
  overflow:hidden; position:relative;
  cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both;
}
.card-open:active { transform:scale(.97); }
.card-open.is-today {
  border-color:rgba(255,110,180,.55);
  background:rgba(255,110,180,.06);
}

/* shimmer sweep on open cards */
.card-open::after {
  content:''; position:absolute;
  top:0; left:-100%; width:60%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.04), transparent);
  animation:shimmer 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shimmer { 0%,100%{left:-100%} 50%{left:140%} }

.card-inner {
  padding:16px 18px;
  display:flex; align-items:center; gap:14px;
}

/* day number — big italic */
.day-block { flex-shrink:0; width:48px; text-align:center; }
.day-n {
  font-family:'Cormorant Garamond', serif;
  font-size:38px; font-weight:300; font-style:italic;
  line-height:1; color:rgba(255,255,255,.18);
  transition:color .2s;
}
.card-open .day-n { color:rgba(255,179,217,.5); }
.card-open.is-today .day-n { color:var(--pink); }
.day-w {
  font-size:7px; letter-spacing:2px;
  color:rgba(255,179,217,.3); margin-top:2px;
}

/* thumbnail strip */
.thumb-strip { display:flex; gap:5px; flex-shrink:0; }
.thumb {
  width:46px; height:46px; border-radius:10px;
  overflow:hidden; position:relative; flex-shrink:0;
  background:linear-gradient(135deg,rgba(255,110,180,.15),rgba(124,58,237,.12));
  border:1px solid rgba(255,110,180,.15);
}
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb-extra {
  display:flex; align-items:center; justify-content:center;
  font-size:10px; color:rgba(255,179,217,.5);
  font-family:'Cormorant Garamond',serif; font-style:italic;
}

/* card right */
.card-right { flex:1; min-width:0; }
.card-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.today-chip {
  font-size:7px; letter-spacing:2px; font-weight:400;
  background:var(--pink); color:#030008;
  padding:2px 9px; border-radius:99px;
  font-family:'DM Mono',monospace;
}
.card-date {
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:13px; color:rgba(255,179,217,.6);
}
.card-open.is-today .card-date { color:rgba(255,179,217,.85); }
.card-badges { display:flex; gap:5px; flex-wrap:wrap; }
.badge {
  font-size:8px; padding:3px 9px; border-radius:99px;
  font-family:'DM Mono',monospace; letter-spacing:.5px;
}
.bi {
  background:rgba(255,110,180,.1); color:rgba(255,179,217,.8);
  border:1px solid rgba(255,110,180,.25);
}
.bv {
  background:rgba(124,58,237,.12); color:rgba(196,167,255,.8);
  border:1px solid rgba(124,58,237,.3);
}
.card-arrow {
  font-size:18px; color:rgba(255,110,180,.3);
  flex-shrink:0; transition:transform .2s, color .2s;
}
.card-open:active .card-arrow { transform:translateX(4px); color:var(--pink); }

/* today pulse border */
.pulse-border {
  position:absolute; inset:0; border-radius:20px;
  border:1.5px solid rgba(255,110,180,.5);
  animation:pulseBorder 2.5s ease-out infinite;
  pointer-events:none;
}
@keyframes pulseBorder {
  0%  { opacity:.8; transform:scale(1); }
  100%{ opacity:0;  transform:scale(1.03); }
}

/* ── LOCKED CARD ── */
.card-locked {
  border-radius:20px;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(255,255,255,.06);
  overflow:hidden; position:relative;
  cursor:pointer;
  animation:slideUp .5s cubic-bezier(.34,1.56,.64,1) both;
  transition:border-color .25s, background .25s;
}
.card-locked:active {
  background:rgba(255,110,180,.04);
  border-color:rgba(255,110,180,.2);
}

.locked-inner {
  padding:18px 20px;
  display:flex; align-items:center; gap:14px;
}

.locked-day-n {
  font-family:'Cormorant Garamond', serif;
  font-size:38px; font-weight:300; font-style:italic;
  color:rgba(255,255,255,.06); line-height:1;
  flex-shrink:0; width:48px; text-align:center;
}

.locked-content { flex:1; }
.locked-title {
  font-family:'Cormorant Garamond', serif; font-style:italic;
  font-size:15px; color:rgba(255,255,255,.35);
  margin-bottom:4px;
}
.locked-date {
  font-size:9px; letter-spacing:1px;
  color:rgba(255,179,217,.3);
}

/* custom SVG lock icon */
.lock-icon { flex-shrink:0; opacity:.4; }

/* countdown chip on locked */
.locked-chip {
  position:absolute; top:12px; right:14px;
  font-size:8px; letter-spacing:1px;
  color:rgba(255,179,217,.35);
  font-family:'DM Mono',monospace;
}

/* horizontal line connector between cards */
.card-connector {
  width:1px; height:14px;
  background:linear-gradient(180deg, rgba(255,110,180,.15), transparent);
  margin:0 auto;
}

/* ── ANIMATIONS ── */
@keyframes slideUp {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:none; }
}

/* ── FLOATING PARTICLES ── */
.particle {
  position:fixed; border-radius:50%;
  pointer-events:none; z-index:1;
  animation:floatP var(--dur,12s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
}
@keyframes floatP {
  0%,100% { transform:translateY(0) rotate(0deg); opacity:var(--op,.15); }
  33%      { transform:translateY(-18px) rotate(120deg); }
  66%      { transform:translateY(8px) rotate(240deg); }
}

/* ── BOTTOM SECTION ── */
.bottom {
  text-align:center;
  padding:40px 30px 0;
}
.bottom-quote {
  font-family:'Gochi Hand', cursive;
  font-size:16px; color:rgba(255,179,217,.22);
  line-height:1.7;
}
.bottom-hearts {
  font-size:13px; color:rgba(255,110,180,.2);
  letter-spacing:8px; margin-top:10px;
}

/* ── TODAY SECTION HEADER ── */
.section-today-head {
  padding:0 20px 14px;
  display:flex; align-items:center; gap:10px;
}
.std-line {
  flex:1; height:1px;
  background:linear-gradient(90deg, rgba(255,110,180,.25), transparent);
}
.std-text {
  font-size:8px; letter-spacing:4px;
  color:rgba(255,110,180,.5);
}
.std-dot {
  width:5px; height:5px; border-radius:50%;
  background:var(--pink);
  animation:dotPulse 1.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes dotPulse {
  0%,100%{ transform:scale(1); opacity:.8; }
  50%{ transform:scale(1.5); opacity:1; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="app">
  <div class="header">
    <div class="header-tag">from vinamra, with love</div>
    <div class="header-name">Letters for<br><em id="rname">Prakriti</em></div>
    <div class="header-sub" id="hsub">a little something, every day ✦</div>

    <!-- progress ring -->
    <div class="progress-wrap">
      <div class="ring-wrap">
        <svg class="ring-svg" width="52" height="52" viewBox="0 0 52 52">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff6eb4"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="26" cy="26" r="22"/>
          <circle class="ring-fill" id="ringFill" cx="26" cy="26" r="22"
            stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
        </svg>
        <div class="ring-center">
          <div class="ring-num" id="ringNum">0</div>
          <div class="ring-label">OPEN</div>
        </div>
      </div>
      <div class="progress-text" id="progText">
        waiting for<br><strong>the first one...</strong>
      </div>
    </div>
  </div>

  <div id="card-list"></div>

  <div class="bottom">
    <div class="bottom-quote">"every day, a little piece of my heart"</div>
    <div class="bottom-hearts">♡ &nbsp; ♡ &nbsp; ♡</div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ── CANVAS STARFIELD ─────────────────────────────────────── */
(function() {
  const c = document.getElementById('bgCanvas');
  const ctx = c.getContext('2d');
  let W, H, stars = [], meteors = [];

  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // generate stars
  for (let i = 0; i < 180; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.4 + .3,
      a: Math.random(),
      da: (Math.random() * .008 + .002) * (Math.random() > .5 ? 1 : -1),
      pink: Math.random() > .82
    });
  }

  function spawnMeteor() {
    meteors.push({
      x: Math.random() * .5 * W,
      y: Math.random() * .4 * H,
      vx: 3 + Math.random() * 3,
      vy: 1.5 + Math.random() * 2,
      life: 1, len: 60 + Math.random() * 80
    });
  }
  setInterval(() => { if (Math.random() > .45) spawnMeteor(); }, 3500);

  // nebula blobs
  const blobs = [
    { x:.2, y:.25, r:180, c:'rgba(124,58,237,.07)' },
    { x:.78, y:.55, c:'rgba(255,110,180,.05)', r:200 },
    { x:.5,  y:.85, c:'rgba(255,61,154,.04)',  r:150 },
  ];

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // nebula
    blobs.forEach(b => {
      const g = ctx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r);
      g.addColorStop(0, b.c); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.beginPath();
      ctx.arc(b.x*W, b.y*H, b.r, 0, Math.PI*2); ctx.fill();
    });

    // stars
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < .05) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.pink
        ? `rgba(255,179,217,${s.a * .8})`
        : `rgba(255,255,255,${s.a})`;
      ctx.fill();
    });

    // meteors
    meteors = meteors.filter(m => m.life > 0);
    meteors.forEach(m => {
      m.x += m.vx; m.y += m.vy; m.life -= .025;
      const g = ctx.createLinearGradient(m.x-m.len,m.y-m.len*.5,m.x,m.y);
      g.addColorStop(0,'transparent');
      g.addColorStop(1,`rgba(255,200,230,${m.life*.7})`);
      ctx.beginPath();
      ctx.moveTo(m.x-m.len, m.y-m.len*.5);
      ctx.lineTo(m.x, m.y);
      ctx.strokeStyle = g; ctx.lineWidth = 1.2; ctx.stroke();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

/* ── HELPERS ─────────────────────────────────────────────── */
function parseDate(s) { return new Date(s); }

function fmtDate(s) {
  return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'long'});
}

function dayStatus(unlocksAt) {
  const now    = new Date();
  const unlock = parseDate(unlocksAt);
  if (now >= unlock) {
    const td = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const ud = new Date(unlock.getFullYear(), unlock.getMonth(), unlock.getDate());
    return td.getTime() === ud.getTime() ? 'today' : 'open';
  }
  return 'locked';
}

function timeUntil(s) {
  const diff = parseDate(s) - new Date();
  if (diff <= 0) return 'now';
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

/* ── BUILD PAGE ──────────────────────────────────────────── */
function build() {
  document.getElementById('rname').textContent = CONFIG.recipientName;
  document.getElementById('hsub').textContent  =
    `a little something, every day ✦`;

  const days   = CONFIG.days;
  const past   = [], today = [], locked = [];
  days.forEach(d => {
    const s = dayStatus(d.unlocksAt);
    if      (s === 'today')  today.push(d);
    else if (s === 'open')   past.push(d);
    else                     locked.push(d);
  });

  const openCount = past.length + today.length;
  const total     = days.length;

  // ring progress
  const pct = total ? openCount / total : 0;
  const circ = 2 * Math.PI * 22;
  setTimeout(() => {
    document.getElementById('ringFill').style.strokeDashoffset =
      circ * (1 - pct);
  }, 300);
  document.getElementById('ringNum').textContent = openCount;
  document.getElementById('progText').innerHTML = openCount === 0
    ? `waiting for<br><strong>the first one...</strong>`
    : openCount === total
    ? `all <strong>${total}</strong> letters<br>opened 💗`
    : `<strong>${total - openCount}</strong> more<br>to come ✦`;

  const list = document.getElementById('card-list');
  list.innerHTML = '';
  let delay = 0;

  function addSection(label, arr, status, isToday) {
    if (!arr.length) return;

    // section header
    const sec = document.createElement('div');
    if (isToday) {
      sec.className = 'section-today-head';
      sec.innerHTML = `<div class="std-line"></div>
        <div class="std-dot"></div>
        <div class="std-text">TODAY</div>
        <div class="std-dot"></div>
        <div class="std-line" style="background:linear-gradient(90deg,transparent,rgba(255,110,180,.25))"></div>`;
    } else {
      sec.className = 'section-label';
      sec.textContent = label;
    }
    list.appendChild(sec);

    const wrap = document.createElement('div');
    wrap.className = 'cards';
    arr.forEach((d, i) => {
      if (i > 0) {
        const conn = document.createElement('div');
        conn.className = 'card-connector';
        wrap.appendChild(conn);
      }
      const el = makeCard(d, status, delay);
      wrap.appendChild(el);
      delay += 70;
    });
    list.appendChild(wrap);

    // spacer
    const sp = document.createElement('div');
    sp.style.height = '20px';
    list.appendChild(sp);
  }

  addSection('PAST', past, 'open', false);
  addSection('TODAY', today, 'today', true);
  addSection('COMING SOON', locked, 'locked', false);
}

/* ── MAKE CARD ───────────────────────────────────────────── */
function makeCard(d, status, delay) {
  const folder = `assets/day${String(d.day).padStart(2,'0')}/`;
  const card   = document.createElement('div');
  card.style.animationDelay = delay + 'ms';

  if (status === 'locked') {
    card.className = 'card-locked';
    const until = timeUntil(d.unlocksAt);
    card.innerHTML = `
      <div class="locked-inner">
        <div class="locked-day-n">${String(d.day).padStart(2,'0')}</div>
        <div class="locked-content">
          <div class="locked-title">something's waiting...</div>
          <div class="locked-date">opens ${fmtDate(d.unlocksAt)}</div>
        </div>
        <svg class="lock-icon" width="22" height="26" viewBox="0 0 22 26" fill="none">
          <rect x="1" y="11" width="20" height="14" rx="4"
            stroke="rgba(255,110,180,.6)" stroke-width="1.5"
            fill="rgba(255,110,180,.06)"/>
          <path d="M6 11V7a5 5 0 0 1 10 0v4"
            stroke="rgba(255,110,180,.6)" stroke-width="1.5"
            stroke-linecap="round" fill="none"/>
          <circle cx="11" cy="18" r="2" fill="rgba(255,110,180,.5)"/>
          <line x1="11" y1="20" x2="11" y2="23"
            stroke="rgba(255,110,180,.5)" stroke-width="1.5"
            stroke-linecap="round"/>
        </svg>
      </div>
      <div class="locked-chip">${until}</div>`;

    card.addEventListener('click', () => {
      sessionStorage.setItem('teaser', JSON.stringify({
        day: d.day, msg: d.teaserMsg, unlocksAt: d.unlocksAt
      }));
      // ripple then navigate
      ripple(card);
      setTimeout(() => window.location.href = 'teaser.html', 280);
    });

  } else {
    const isToday = status === 'today';
    card.className = `card-open${isToday ? ' is-today' : ''}`;

    // thumbs
    const imgs  = d.images || [];
    const show  = imgs.slice(0, 2);
    let thumbsHtml = show.map(img => `
      <div class="thumb">
        <img src="${folder}${img}"
          onerror="this.parentNode.classList.add('thumb-extra');this.remove();this.parentNode.innerHTML='?'"
          loading="lazy">
      </div>`).join('');
    if (imgs.length > 2) {
      thumbsHtml += `<div class="thumb thumb-extra">+${imgs.length - 2}</div>`;
    }

    const voices = d.voices || [];
    let badgesHtml = '';
    if (imgs.length)   badgesHtml += `<span class="badge bi">${imgs.length} photo${imgs.length>1?'s':''}</span>`;
    if (voices.length) badgesHtml += `<span class="badge bv">${voices.length} voice${voices.length>1?'s':''}</span>`;

    const dateStr = isToday ? '' :
      `<div class="card-date">${fmtDate(d.unlocksAt)}</div>`;

    card.innerHTML = `
      ${isToday ? '<div class="pulse-border"></div>' : ''}
      <div class="card-inner">
        <div class="day-block">
          <div class="day-n">${String(d.day).padStart(2,'0')}</div>
          <div class="day-w">DAY</div>
        </div>
        <div class="thumb-strip">${thumbsHtml}</div>
        <div class="card-right">
          <div class="card-top">
            ${isToday ? '<span class="today-chip">TODAY</span>' : ''}
            ${dateStr}
          </div>
          <div class="card-badges">${badgesHtml}</div>
        </div>
        <div class="card-arrow">›</div>
      </div>`;

    card.addEventListener('click', () => {
      ripple(card);
      setTimeout(() => window.location.href = `letter.html?day=${d.day}`, 200);
    });
  }

  return card;
}

/* ── RIPPLE ─────────────────────────────────────────────── */
function ripple(el) {
  const r = document.createElement('div');
  Object.assign(r.style, {
    position:'absolute', inset:'0', borderRadius:'20px',
    background:'rgba(255,110,180,.12)',
    animation:'rippleFade .35s ease-out forwards',
    pointerEvents:'none', zIndex:'10'
  });
  if (!document.getElementById('rippleKf')) {
    const s = document.createElement('style');
    s.id = 'rippleKf';
    s.textContent = `@keyframes rippleFade{from{opacity:1}to{opacity:0;transform:scale(1.04)}}`;
    document.head.appendChild(s);
  }
  el.style.position = 'relative';
  el.appendChild(r);
  setTimeout(() => r.remove(), 380);
}

/* ── FLOATING PARTICLES ─────────────────────────────────── */
(function() {
  const shapes = ['♡','✦','·','∘'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = shapes[i % shapes.length];
    const size = 8 + Math.random() * 8;
    p.style.cssText = `
      left:${Math.random()*90+5}%;
      top:${Math.random()*80+10}%;
      font-size:${size}px;
      color:rgba(255,110,180,${.06 + Math.random()*.08});
      --dur:${10+Math.random()*12}s;
      --dl:${Math.random()*10}s;
      --op:${.07 + Math.random()*.1};
    `;
    document.body.appendChild(p);
  }
})();

build();

/* ── AUTO REFRESH when a card is about to unlock ────────── */
(function() {
  const next = CONFIG.days
    .map(d => parseDate(d.unlocksAt))
    .filter(d => d > new Date())
    .sort((a,b) => a-b)[0];
  if (!next) return;
  const ms = next - new Date();
  if (ms < 3600000) setTimeout(() => location.reload(), ms + 1000);
})();
</script>
